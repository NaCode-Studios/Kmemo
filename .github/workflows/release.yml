name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release
  # Build provenance: id-token signs the attestation, attestations stores it against the repository.
  id-token: write
  attestations: write

jobs:
  publish:
    # macOS, not Linux, and this is not a preference. kmemo-core publishes iOS and macOS artifacts,
    # and those targets can only be compiled on an Apple host — a Linux runner would disable those
    # tasks and publish a release that silently omits them. The macOS runner builds every target this
    # project has, so one job still publishes the whole set.
    runs-on: macos-latest
    # Pinned to node24 action majors — see the note in ci.yml.
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Assembled before the attestation so the provenance covers the exact files the publish step
      # uploads: the publish tasks find these up to date and send them rather than rebuilding.
      - name: Assemble the published artifacts
        run: ./gradlew assemble --no-daemon --no-configuration-cache

      # Derived from the build, not listed by hand. A module that starts publishing is attested without
      # anyone remembering to add it here, one that ships no jar (the BOM) is skipped, and a module that
      # builds a jar but is not published (the TCK, the benchmarks, the example) is never attested.
      - name: Collect the published artifacts
        id: artifacts
        run: |
          {
            echo 'paths<<PATHS'
            # Both extensions, because kmemo-core is multiplatform: its JVM and JS artifacts are jars
            # and its Apple, Linux and Windows artifacts are klibs. Globbing jars alone would have
            # published the native targets with no provenance while the README claimed every artifact
            # carries one.
            for m in $(grep -l 'mavenPublishing' */build.gradle.kts | xargs -n1 dirname); do
              for ext in jar klib; do
                compgen -G "$m/build/libs/*.$ext" >/dev/null && echo "$m/build/libs/*.$ext"
              done
            done
            echo PATHS
          } >> "$GITHUB_OUTPUT"

      # Before publishing, so a failed attestation cannot leave released-but-unattested artifacts.
      - name: Attest build provenance (SLSA)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Publish to Maven Central
        if: github.event_name == 'push'
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # The body is extracted from CHANGELOG.md, never written by hand: a release note composed
      # separately is a second copy of what the changelog owns, and the two eventually disagree.
      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/     { exit }
            found                 { print }
          ' CHANGELOG.md > notes.md
          # An empty body means the tag and the changelog disagree. Fail rather than publish a blank one.
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

      # Metadata only, not a distribution channel: this tells GitHub which artifacts the repository
      # built and where they actually live, so the Packages panel reflects Maven Central instead of
      # sitting empty. Nothing is hosted here and nobody downloads from here, which is the whole
      # difference from the GitHub Packages copy dropped in this same release.
      #
      # Non-fatal on purpose. It annotates a publish that has already succeeded, so a metadata call
      # failing must never turn a good release into a failed one. The endpoint is org-scoped and the
      # write permission is undocumented, so if GITHUB_TOKEN turns out not to carry it, set an
      # ARTIFACT_METADATA_TOKEN secret with org access and this starts working with no code change.
      - name: Link the published artifacts to this repository
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_METADATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://repo1.maven.org/maven2/io/github/nacode-studios"
          for m in $(grep -l 'mavenPublishing' */build.gradle.kts | xargs -n1 dirname); do
            JAR="$m/build/libs/$m-$VERSION.jar"
            # The BOM ships no jar, so it has nothing to record.
            [ -f "$JAR" ] || continue
            gh api -X POST "/orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/metadata/storage-record" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -f name="$m" \
              -f version="$VERSION" \
              -f digest="sha256:$(shasum -a 256 "$JAR" | cut -d' ' -f1)" \
              -f registry_url="https://repo1.maven.org/maven2/" \
              -f artifact_url="$BASE/$m/$VERSION/$m-$VERSION.jar" \
              -f repository="io.github.nacode-studios" \
              -f status="active" \
              --silent && echo "recorded $m $VERSION"
          done
