name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kmemo compiles to JVM 17 bytecode (a fixed toolchain), so 17 is the compile/test JDK; 21 and
        # 23 additionally run Gradle and the build to catch a plugin or JDK regression on newer runtimes.
        java: ["17", "21", "23"]
    # Every action below is pinned to a major that declares `using: node24`. Node 20 is deprecated
    # on GitHub-hosted runners, and the previous majors (checkout@v4/v5, setup-java@v4,
    # setup-gradle@v4/v5, upload-artifact@v4) still target it — they only run because the runner
    # force-upgrades them. Do not lower these majors without checking `runs.using` first.
    steps:
      - uses: actions/checkout@v7

      # Install both JDK 17 (for the jvmToolchain(17) the build pins) and the matrix JDK, which becomes
      # JAVA_HOME and so runs Gradle itself.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The external split is fetched rather than committed, so the licence stays with the dataset.
      # See tools/external-corpus/README.md. This job is the one place its floor is actually enforced,
      # which is why every gradle call below passes -PexternalCorpusRequired=true: without the flag a
      # missing file skips the test, and a floor nobody notices has stopped running is not a floor.
      - name: Fetch the external corpus split
        run: |
          python -m pip install -r tools/external-corpus/requirements.txt
          python tools/external-corpus/fetch.py

      # The question split, fetched and enforced the same way. It is the larger of the two blind
      # splits and the only one in the register the guards were built for.
      - name: Fetch the question corpus split
        run: |
          python -m pip install -r tools/qqp-corpus/requirements.txt
          python tools/qqp-corpus/fetch.py

      # The retrieval corpus is fetched for the same reason and enforced the same way: without the flag
      # a missing file skips the measurement, and a measurement nobody notices has stopped running reads
      # as a passing one.
      - name: Fetch the retrieval corpus
        run: |
          python -m pip install -r tools/rag-corpus/requirements.txt
          python tools/rag-corpus/fetch.py

      # `build` runs the tests, the public-API check, ktlint and detekt.
      - name: Build, test, lint and verify public API
        run: >-
          ./gradlew build
          -PexternalCorpusRequired=true -PqqpCorpusRequired=true -PragCorpusRequired=true
          --no-daemon --stacktrace

      # The corpus report is this project's headline claim. Keeping it in the build log means the
      # numbers in the README can always be checked against a real run.
      - name: Corpus report (five splits)
        run: >-
          ./gradlew :kmemo-core:jvmTest
          --tests '*CorpusTest*' --tests '*ExternalCorpusTest*' --tests '*QqpCorpusTest*'
          -PexternalCorpusRequired=true -PqqpCorpusRequired=true --rerun-tasks --no-daemon

      # The published documents against the measurements, with no Gradle involved. The corpus floors
      # catch a guard whose rate slips; this catches a sentence that stopped being true.
      - name: Check the published figures
        run: python tools/figures/check.py

      # The specification, implemented from its own prose, reproducing every vector and every corpus
      # figure. A specification nobody has implemented is one whose gaps nobody has found.
      - name: Score the corpora outside the JVM
        working-directory: tools/corpus-runner
        run: >-
          python score.py --vectors
          --corpus ../../kmemo-core/src/jvmTest/resources/near-miss-corpus.json
          --corpus ../../kmemo-core/src/jvmTest/resources/held-out-corpus.json
          --corpus ../../kmemo-core/src/jvmTest/resources/validation-corpus.json
          --corpus ../../build/external-corpus/paws-wiki-test.json
          --corpus ../../build/qqp-corpus/qqp-questions.json

      # The archive a reader downloads instead of cloning this repository.
      - name: Build the corpus bundle
        run: ./gradlew corpusBundle --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/ktlint/
            **/build/reports/detekt/
          retention-days: 7

  # kmemo-core is multiplatform, and the Apple targets cannot be compiled on Linux at all — the
  # Kotlin plugin disables those tasks rather than failing, which would leave iOS and macOS silently
  # unbuilt if this job did not exist. One JDK is enough here: the matrix above already covers the
  # runtime dimension, and this job covers the host dimension.
  apple-targets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and test the Apple targets
        run: >-
          ./gradlew
          macosArm64Test iosSimulatorArm64Test
          compileKotlinIosArm64 compileKotlinIosX64 compileKotlinMacosX64
          --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-apple
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # Fail a PR that introduces a dependency with a known vulnerability or a disallowed license.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
