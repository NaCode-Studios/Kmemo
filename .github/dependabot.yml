version: 2
updates:
  # Gradle dependencies (the version catalog and build scripts).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine test/tooling bumps, individual PRs for the rest.
      test-and-tooling:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
          - "io.kotest:*"
          - "org.assertj:*"
          - "ch.qos.logback:*"
          - "org.testcontainers:*"

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The Kotlin/JS toolchain writes kotlin-js-store/yarn.lock, and the versions in it come from the yarn
  # resolutions in the root build.gradle.kts. Dependabot has no package.json to edit here, so its
  # security updates fail every time they run and leave a red check on a green repository. Worse, a
  # patch it did manage to write into the lock would be undone by the next kotlinUpgradeYarnLock.
  #
  # Turning it off is not the same as ignoring the alerts: the alerts still fire, and they are answered
  # by adding a resolution in the Gradle build, which is where those versions are actually decided.
  - package-ecosystem: npm
    directory: "/kotlin-js-store"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
